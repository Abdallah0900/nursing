.topic{

    font-size:14px;

.complete{
    background:#e2e8f0;
    color:#0f172a;

.done .complete{

    color:white;

    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);

    overflow:auto;

.close{

.modal h2{

const STORAGE_KEY="nursing30progress";

let completed=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");

function save(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(completed));
}

function updateProgress(){

const count=completed.length;

document.getElementById("progressText").textContent =
count+" / 30 Days";

document.getElementById("progressBar").style.width =
(count/30*100)+"%";
}

function render(){

const container=document.getElementById("days");
const search=document.getElementById("search").value.toLowerCase();
const week=document.getElementById("weekFilter").value;

container.innerHTML="";

days
.filter(d=>{

const text=
(d.title+" "+d.topic+" "+JSON.stringify(d.content))
.toLowerCase();

const matchesSearch=text.includes(search);

const matchesWeek=
week==="all" || String(d.week)===week;

return matchesSearch && matchesWeek;

})
.forEach(d=>{

const done=completed.includes(d.day);

const card=document.createElement("div");

card.className="day-card"+(done?" done":"");

card.innerHTML=`

<div class="day-number">DAY ${d.day}</div>

<div class="day-title">${d.title}</div>

<div class="week">Week ${d.week}</div>

<div class="topic">${d.topic}</div>

<div class="buttons">

<button class="details"
onclick="openModal(${d.day})">
Details
</button>

<button class="complete"
onclick="toggleDay(${d.day})">
${done?"✓ Completed":"Mark Complete"}
</button>

</div>

`;

container.appendChild(card);

});

updateProgress();
}

function toggleDay(day){

if(completed.includes(day)){

completed=completed.filter(x=>x!==day);

}else{

completed.push(day);

}

save();
render();
}

function openModal(day){

const d=days.find(x=>x.day===day);

document.getElementById("modalTitle").textContent=
"Day "+d.day+" — "+d.title;

let html="";

html+=`

<div class="section">

<h3>🎯 Objectives</h3>

<ul>
${d.content.objectives.map(x=>`<li>${x}</li>`).join("")}
</ul>

</div>

`;

html+=`

<div class="section">

<h3>🩺 Nursing Skills</h3>

<ul>
${d.content.skills.map(x=>`<li>${x}</li>`).join("")}
</ul>

</div>

`;

html+=`

<div class="section">

<h3>⭐ Must Know</h3>

<ul>
${d.content.mustKnow.map(x=>`<li>${x}</li>`).join("")}
</ul>

</div>

`;

html+=`

<div class="section">

<h3>🚨 Clinical Scenario</h3>

<div class="scenario">

${d.content.scenario}

</div>

</div>

`;

document.getElementById("modalContent").innerHTML=html;

document.getElementById("modal").style.display="block";
}

function closeModal(){

document.getElementById("modal").style.display="none";

}

function resetProgress(){

if(confirm("Reset all 30-day progress?")){

completed=[];

save();

render();

}

}

document.getElementById("search")
.addEventListener("input",render);

document.getElementById("weekFilter")
.addEventListener("change",render);

document.getElementById("modal")
.addEventListener("click",function(e){

if(e.target===this) closeModal();

});

render();

</script>
